<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pagamento com Cartão</title>

  <!-- Importação do CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <!-- CARTÃO VIRTUAL -->
    <section class="card-container" id="cardContainer">
      <div class="card">
        <!-- FRENTE DO CARTÃO -->
        <div class="card-front">
          <div class="card-logo">VISA</div>
          <div class="chip"></div>
          <div class="card-number" id="cardNumber">
            0000 0000 0000 0000
          </div>
          <div class="card-info">
            <div>
              <span class="card-label">Nome</span>
              <span class="card-name" id="cardName">
                SEU NOME
              </span>
            </div>
            <div>
              <span class="card-label">Validade</span>
              <span class="card-date" id="cardDate">
                00/00
              </span>
            </div>
          </div>
        </div>
        <!-- VERSO DO CARTÃO -->
        <div class="card-back">
          <div class="magnetic-strip"></div>
          <div class="cvv-area">
            <div class="cvv-strip" id="cardCvv">
              000
            </div>
          </div>
          <p class="back-text">
            Este cartão é apenas uma representação visual
            para fins de demonstração.
          </p>
        </div>
      </div>
    </section>
    <!-- FORMULÁRIO -->
    <section class="payment-form">
      <h1>Pagamento</h1>
      <p>
        Preencha os dados do seu cartão.
      </p>
      <form id="paymentForm">
        <!-- NÚMERO -->
        <div class="form-group">
          <label for="number">
            Número do cartão
          </label>
          <input
            type="text"
            id="number"
            placeholder="0000 0000 0000 0000"
            maxlength="19"
            inputmode="numeric"
            autocomplete="cc-number"
          >
        </div>
        <!-- NOME -->
        <div class="form-group">
          <label for="name">
            Nome no cartão
          </label>
          <input
            type="text"
            id="name"
            placeholder="SEU NOME"
            maxlength="25"
            autocomplete="cc-name"
          >
        </div>
        <!-- VALIDADE E CVV -->
        <div class="row">
          <div class="form-group">
            <label for="date">
              Validade
            </label>
            <input
              type="text"
              id="date"
              placeholder="MM/AA"
              maxlength="5"
              inputmode="numeric"
              autocomplete="cc-exp"
            >
          </div>
          <div class="form-group">
            <label for="cvv">
              CVV
            </label>
            <input
              type="text"
              id="cvv"
              placeholder="000"
              maxlength="3"
              inputmode="numeric"
              autocomplete="cc-csc"
            >
          </div>
        </div>
        <button type="submit">
          Finalizar pagamento
        </button>

      </form>

    </section>

  </main>
  <!-- Importação do JavaScript -->
  <script src="script.js"></script>

</body>
</html>
