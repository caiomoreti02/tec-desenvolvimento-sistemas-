<!DOCTYPE html>

<html>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulário</title>
    </head>
    <body>
        <h1>Formulário do Senai</h1>
        <input
        id="image"
        type="image"
        width="100"
        height="50"
        alt="senai"
        src="https://plataforma.gpinovacao.senai.br/plataforma/media/upload/gp-desafio/ceeH5Vvd_450x289.jpg" />

    <form action="">
            <p>Preencha o formulário abaixo com seus dados pessoais. Todos os campos são obrigatórios.</p>
            <label for="">Nome Completo:</label>
            <input type="text" placeholder="Digite seu nome aqui" required>
            
            <br>

            <label for="email">Email:</label>
            <input type="email" name="email" id="email" placeholder="Digite seu email aqui" required>

            <br>

            <label for="">Senha:</label>
            <input type="password" placeholder="Digite sua senha aqui" required>
            
            <br>

            <label for="">Data de Nascimento:</label>
            <input type="date"  name = "dataNascimento"  id="dataNascimento" placeholder="Digite sua data de nascimento aqui" required>

            <br>

            <label for="masculino">Masculino</label>
            <input type="radio" name="genero" id="masculino" value="Masculino">

            <br>
            
            <label for="feminino">Feminino</label>
            <input type="radio" name="genero" id="feminino" value="Feminino">
            
            <br>

            <label for="naoEspecificado">Não especificado</label>
            <input type="radio" name="genero" id="naoEspecificado" value="Não especificado">
            
            <br>
            <label>Precisa de ajuda?</label>
            <input type="checkbox">
            
            <br>
            <textarea name="mensagem" id="" placeholder="Digite aqui a sua mensagem" rows="10" cols="40" required></textarea>
            
            <br>
            <button>Submit</button>
            
        </form>

    </body>
</html>
